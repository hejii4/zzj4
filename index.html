<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张梓建 · 个人简历</title>
    <style>
        /* ===== CSS Variables & Reset ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --color-primary: #1e3a5f;
            --color-primary-light: #2d5a8a;
            --color-primary-dark: #0d1b2a;
            --color-accent: #2d8cff;
            --color-accent-light: #6db3ff;
            --color-gold: #f6b83d;
            --color-bg: #f0f4f8;
            --color-card: #ffffff;
            --color-text: #1a2332;
            --color-text-secondary: #4a5a6e;
            --color-text-muted: #7a8a9e;
            --color-border: #dce4ec;
            --color-shadow: rgba(26, 35, 50, 0.08);
            --radius: 14px;
            --transition: 0.25s ease;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            --max-width: 1120px;
            --nav-height: 68px;
        }

        [data-theme="dark"] {
            --color-primary: #4a7db5;
            --color-primary-light: #6b9fd4;
            --color-primary-dark: #0a1420;
            --color-bg: #0f172a;
            --color-card: #1b2d45;
            --color-text: #e8edf3;
            --color-text-secondary: #b0c4d8;
            --color-text-muted: #7a8fa8;
            --color-border: #2a3f5a;
            --color-shadow: rgba(0, 0, 0, 0.3);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            transition: background var(--transition), color var(--transition);
            padding-top: var(--nav-height);
            min-height: 100vh;
        }

        a {
            color: var(--color-accent);
            text-decoration: none;
            transition: color var(--transition);
        }
        a:hover {
            color: var(--color-accent-light);
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--color-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-primary-light);
            border-radius: 8px;
        }

        /* ===== Container ===== */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px 40px;
        }

        /* ===== Navigation ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: rgba(var(--color-card-rgb, 255, 255, 255), 0.82);
            backdrop-filter: blur(14px) saturate(1.2);
            -webkit-backdrop-filter: blur(14px) saturate(1.2);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            z-index: 1000;
            transition: background var(--transition), border-color var(--transition);
        }
        [data-theme="dark"] .navbar {
            background: rgba(15, 23, 42, 0.85);
        }
        :root {
            --color-card-rgb: 255, 255, 255;
        }
        [data-theme="dark"] {
            --color-card-rgb: 27, 45, 69;
        }

        .navbar .brand {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--color-primary);
            letter-spacing: 0.5px;
            transition: color var(--transition);
        }
        .navbar .brand span {
            color: var(--color-accent);
        }

        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            list-style: none;
            flex-wrap: wrap;
        }
        .navbar .nav-links a {
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            transition: all var(--transition);
            position: relative;
        }
        .navbar .nav-links a:hover,
        .navbar .nav-links a.active {
            color: var(--color-text);
            background: var(--color-border);
        }
        .navbar .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar .nav-actions button {
            background: transparent;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 30px;
            color: var(--color-text-secondary);
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .navbar .nav-actions button:hover {
            background: var(--color-border);
            color: var(--color-text);
        }
        .navbar .nav-actions .theme-toggle {
            font-size: 1.05rem;
        }
        .navbar .nav-actions .print-btn {
            font-size: 1.05rem;
        }

        /* mobile nav toggle */
        .navbar .menu-toggle {
            display: none;
            background: transparent;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--color-text-secondary);
            padding: 4px 8px;
        }

        @media (max-width: 768px) {
            .navbar .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: var(--nav-height);
                left: 0;
                right: 0;
                background: var(--color-card);
                border-bottom: 1px solid var(--color-border);
                padding: 16px 24px;
                gap: 4px;
                box-shadow: 0 12px 30px var(--color-shadow);
            }
            .navbar .nav-links.open {
                display: flex;
            }
            .navbar .nav-links a {
                padding: 10px 16px;
                width: 100%;
                border-radius: 10px;
            }
            .navbar .menu-toggle {
                display: block;
            }
            .navbar .brand {
                font-size: 1rem;
            }
        }

        /* ===== Hero ===== */
        .hero {
            padding: 48px 0 32px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
        }
        .hero .hero-text h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.15;
            color: var(--color-primary);
            transition: color var(--transition);
        }
        .hero .hero-text h1 .highlight {
            background: linear-gradient(135deg, var(--color-accent), var(--color-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero .hero-text .subtitle {
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            margin-top: 8px;
            font-weight: 400;
        }
        .hero .hero-text .bio {
            margin-top: 16px;
            color: var(--color-text-secondary);
            font-size: 0.98rem;
            max-width: 480px;
            line-height: 1.7;
        }
        .hero .hero-text .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
        }
        .hero .hero-text .tag-group .tag {
            background: var(--color-border);
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            transition: all var(--transition);
        }
        .hero .hero-text .tag-group .tag:hover {
            background: var(--color-accent);
            color: #fff;
        }
        .hero .hero-text .contact-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 24px;
        }
        .hero .hero-text .contact-actions .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            background: var(--color-primary);
            color: #fff;
        }
        .hero .hero-text .contact-actions .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(30, 58, 95, 0.25);
        }
        .hero .hero-text .contact-actions .btn-outline {
            background: transparent;
            color: var(--color-text);
            border: 1.5px solid var(--color-border);
        }
        .hero .hero-text .contact-actions .btn-outline:hover {
            background: var(--color-border);
            box-shadow: none;
            transform: none;
        }
        
        /* ===== 头像占位符（无图片版本） ===== */
        .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hero .hero-visual .avatar-placeholder {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-primary-light), var(--color-accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.2rem;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 16px 48px rgba(45, 140, 255, 0.20);
            user-select: none;
        }

        @media (max-width: 768px) {
            .hero {
                grid-template-columns: 1fr;
                text-align: center;
                padding: 24px 0 16px;
            }
            .hero .hero-text .bio {
                max-width: 100%;
                margin-left: auto;
                margin-right: auto;
            }
            .hero .hero-text .tag-group {
                justify-content: center;
            }
            .hero .hero-text .contact-actions {
                justify-content: center;
            }
            .hero .hero-visual .avatar-placeholder {
                width: 140px;
                height: 140px;
                font-size: 3rem;
            }
            .hero .hero-text h1 {
                font-size: 2.2rem;
            }
        }

        /* ===== Highlights ===== */
        .highlights {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            padding: 28px 0 16px;
            border-top: 1px solid var(--color-border);
            border-bottom: 1px solid var(--color-border);
            margin: 12px 0 32px;
        }
        .highlights .hl-item {
            text-align: center;
            padding: 12px 8px;
        }
        .highlights .hl-item .number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--color-accent);
            line-height: 1.2;
        }
        .highlights .hl-item .number .suffix {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .highlights .hl-item .label {
            font-size: 0.8rem;
            color: var(--color-text-muted);
            margin-top: 2px;
        }
        @media (max-width: 480px) {
            .highlights .hl-item .number {
                font-size: 1.5rem;
            }
        }

        /* ===== Section ===== */
        .section {
            margin-top: 40px;
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }
        .section-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-primary);
            transition: color var(--transition);
        }
        .section-header .line {
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--color-border), transparent);
        }

        /* ===== Tabs ===== */
        .tabs-container {
            margin-top: 4px;
        }
        .tabs-nav {
            display: flex;
            gap: 4px;
            border-bottom: 2px solid var(--color-border);
            padding-bottom: 0;
            flex-wrap: wrap;
        }
        .tabs-nav button {
            background: transparent;
            border: none;
            padding: 10px 22px;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--color-text-muted);
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all var(--transition);
            position: relative;
            font-family: var(--font);
        }
        .tabs-nav button:hover {
            color: var(--color-text);
            background: var(--color-border);
        }
        .tabs-nav button[aria-selected="true"] {
            color: var(--color-accent);
            background: transparent;
        }
        .tabs-nav button[aria-selected="true"]::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 20%;
            right: 20%;
            height: 3px;
            background: var(--color-accent);
            border-radius: 4px 4px 0 0;
        }
        .tabs-panel {
            display: none;
            padding-top: 24px;
            animation: fadeUp 0.35s ease;
        }
        .tabs-panel.active {
            display: block;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Experience Cards ===== */
        .exp-card {
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 24px 28px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px var(--color-shadow);
            border: 1px solid var(--color-border);
            transition: all var(--transition);
        }
        .exp-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px var(--color-shadow);
        }
        .exp-card .exp-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }
        .exp-card .exp-header h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--color-primary);
        }
        .exp-card .exp-header .company {
            font-weight: 600;
            color: var(--color-accent);
        }
        .exp-card .exp-header .period {
            font-size: 0.82rem;
            color: var(--color-text-muted);
            font-weight: 500;
        }
        .exp-card .exp-desc {
            color: var(--color-text-secondary);
            font-size: 0.92rem;
            line-height: 1.7;
        }
        .exp-card .exp-desc ul {
            list-style: none;
            padding: 0;
            margin: 6px 0 0;
        }
        .exp-card .exp-desc ul li {
            padding: 4px 0 4px 22px;
            position: relative;
        }
        .exp-card .exp-desc ul li::before {
            content: '▹';
            position: absolute;
            left: 0;
            color: var(--color-accent);
            font-weight: 700;
        }
        .exp-card .exp-desc .strong {
            color: var(--color-text);
            font-weight: 600;
        }

        /* ===== Project Cards (grid) ===== */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .project-card {
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 22px 24px;
            border: 1px solid var(--color-border);
            box-shadow: 0 2px 10px var(--color-shadow);
            transition: all var(--transition);
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 36px var(--color-shadow);
        }
        .project-card h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--color-primary);
        }
        .project-card .meta {
            font-size: 0.82rem;
            color: var(--color-text-muted);
            margin: 2px 0 10px;
        }
        .project-card p {
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            line-height: 1.6;
        }
        .project-card .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 12px;
        }
        .project-card .tags span {
            background: var(--color-border);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--color-text-muted);
        }

        /* ===== Skills ===== */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }
        .skill-group {
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 18px 20px;
            border: 1px solid var(--color-border);
            box-shadow: 0 2px 8px var(--color-shadow);
        }
        .skill-group h4 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }
        .skill-group .skill-items {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .skill-group .skill-items .badge {
            background: var(--color-border);
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            transition: all var(--transition);
        }
        .skill-group .skill-items .badge:hover {
            background: var(--color-accent);
            color: #fff;
        }

        /* ===== Education & Awards ===== */
        .edu-award-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .edu-card,
        .award-card {
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            border: 1px solid var(--color-border);
            box-shadow: 0 2px 8px var(--color-shadow);
        }
        .edu-card h3,
        .award-card h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--color-primary);
        }
        .edu-card .sub {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
        }
        .edu-card .period {
            font-size: 0.8rem;
            color: var(--color-text-muted);
            margin-top: 2px;
        }
        .edu-card .desc {
            font-size: 0.88rem;
            color: var(--color-text-secondary);
            margin-top: 8px;
            line-height: 1.6;
        }
        .award-card ul {
            list-style: none;
            padding: 0;
            margin: 6px 0 0;
        }
        .award-card ul li {
            padding: 4px 0;
            font-size: 0.9rem;
            color: var(--color-text-secondary);
            border-bottom: 1px solid var(--color-border);
        }
        .award-card ul li:last-child {
            border-bottom: none;
        }
        .award-card ul li .date {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .edu-award-grid {
                grid-template-columns: 1fr;
            }
            .project-grid {
                grid-template-columns: 1fr;
            }
            .skills-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ===== Footer ===== */
        .footer {
            margin-top: 56px;
            padding: 24px 0 16px;
            border-top: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.8rem;
            color: var(--color-text-muted);
        }
        .footer .heart {
            color: #e74c6f;
        }

        /* ===== Back to Top ===== */
        .back-top {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--color-primary);
            color: #fff;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            transition: all var(--transition);
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-top.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .back-top:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 8px 28px rgba(30, 58, 95, 0.30);
        }

        /* ===== Print ===== */
        @media print {
            .navbar,
            .back-top,
            .no-print {
                display: none !important;
            }
            body {
                padding-top: 0;
                background: #fff !important;
                color: #000 !important;
                font-size: 12px;
            }
            .container {
                max-width: 100%;
                padding: 20px 36px;
            }
            .hero {
                padding: 20px 0 12px;
                gap: 20px;
            }
            .hero .hero-text h1 {
                font-size: 2.2rem;
                color: #1a2332 !important;
            }
            .hero .hero-visual .avatar-placeholder {
                width: 120px;
                height: 120px;
                box-shadow: none;
                background: #e8edf3;
                color: #1a2332;
            }
            .exp-card,
            .project-card,
            .skill-group,
            .edu-card,
            .award-card {
                box-shadow: none !important;
                border: 1px solid #ddd !important;
                transform: none !important;
                break-inside: avoid;
                page-break-inside: avoid;
            }
            .highlights {
                border-color: #ddd;
            }
            .highlights .hl-item .number {
                color: #1e3a5f;
            }
            .section-header h2 {
                color: #1a2332 !important;
            }
            .tabs-nav button[aria-selected="true"]::after {
                background: #1e3a5f;
            }
            .tabs-panel {
                display: block !important;
                animation: none !important;
                padding-top: 8px;
            }
            .tabs-nav {
                display: none !important;
            }
            .tabs-panel:not(.active) {
                display: none !important;
            }
            .exp-card .exp-header .period {
                color: #555;
            }
            .project-card .tags span {
                background: #eee;
                color: #333;
            }
            .skill-group .skill-items .badge {
                background: #eee;
                color: #333;
            }
            .footer {
                border-color: #ddd;
                color: #666;
            }
            .edu-award-grid {
                grid-template-columns: 1fr 1fr;
            }
            .project-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* ===== Reduced Motion ===== */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .tabs-panel {
                animation: none !important;
            }
            .exp-card:hover,
            .project-card:hover {
                transform: none !important;
            }
            html {
                scroll-behavior: auto;
            }
        }

        /* ===== Utility ===== */
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-16 {

        function renderExperienceTabs() {
            const nav = document.getElementById('expTabsNav');
            const panels = document.getElementById('expPanels');

            const keys = Object.keys(resume.experiences);
            const validKeys = keys.filter(k => resume.experiences[k].length > 0);

            if (validKeys.length === 0) {
                nav.innerHTML = '';
                panels.innerHTML = '<p style="color:var(--color-text-muted);padding:16px 0;">暂无经历数据</p>';
                return;
            }

            const labelMap = {
                internship: '💼 实习经历',
                campus: '🎓 校园经历',
                work: '🏢 工作经历'
            };

            nav.innerHTML = validKeys.map((key, idx) =>
                `<button role="tab" aria-selected="${idx === 0 ? 'true' : 'false'}"
                         aria-controls="panel-${key}" id="tab-${key}"
                         data-key="${key}">
                    ${labelMap[key] || key}
                </button>`
            ).join('');

            panels.innerHTML = validKeys.map((key, idx) => {
                const exps = resume.experiences[key];
                const cards = exps.map(exp => `
                    <div class="exp-card">
                        <div class="exp-header">
                            <h3>${exp.title} <span class="company">· ${exp.company}</span></h3>
                            <span class="period">${exp.period} · ${exp.location}</span>
                        </div>
                        <div class="exp-desc">
                            <ul>
                                ${exp.details.map(d => `<li>${d}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                `).join('');
                return `<div id="panel-${key}" class="tabs-panel ${idx === 0 ? 'active' : ''}"
                           role="tabpanel" aria-labelledby="tab-${key}">
                            ${cards}
                        </div>`;
            }).join('');

            document.querySelectorAll('#expTabsNav button').forEach(btn => {
                btn.addEventListener('click', function() {
                    const key = this.dataset.key;
                    document.querySelectorAll('#expTabsNav button').forEach(b =>
                        b.setAttribute('aria-selected', 'false')
                    );
                    this.setAttribute('aria-selected', 'true');
                    document.querySelectorAll('#expPanels .tabs-panel').forEach(p => {
                        p.classList.remove('active');
                    });
                    const panel = document.getElementById(`panel-${key}`);
                    if (panel) panel.classList.add('active');
                });
                btn.addEventListener('keydown', function(e) {
                    const buttons = [...document.querySelectorAll('#expTabsNav button')];
                    const idx = buttons.indexOf(this);
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                        e.preventDefault();
                        const next = buttons[(idx + 1) % buttons.length];
                        if (next) next.click();
                    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                        e.preventDefault();
                        const prev = buttons[(idx - 1 + buttons.length) % buttons.length];
                        if (prev) prev.click();
                    }
                });
            });
        }

        function setupEmailCopy() {
            const btn = document.getElementById('emailBtn');
            if (!btn) return;
            btn.addEventListener('click', function() {
                const user = '1689977618';
                const domain = 'qq.com';
                const email = user + '@' + domain;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(email).then(() => {
                        const orig = this.textContent;
                        this.textContent = '✅ 已复制！';
                        setTimeout(() => { this.textContent = orig; }, 2000);
                    }).catch(() => {
                        fallbackCopy(email, this);
                    });
                } else {
                    fallbackCopy(email, this);
                }
            });
        }

        function fallbackCopy(email, btn) {
            const ta = document.createElement('textarea');
            ta.value = email;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                const orig = btn.textContent;
                btn.textContent = '✅ 已复制！';
                setTimeout(() => { btn.textContent = orig; }, 2000);
            } catch (e) {
                alert('复制失败，请手动复制：' + email);
            }
            document.body.removeChild(ta);
        }

        // ============================================================
        //  THEME TOGGLE
        // ============================================================
        function setupThemeToggle() {
            const btn = document.querySelector('.theme-toggle');
            const html = document.documentElement;
            const stored = localStorage.getItem('theme');
            if (stored === 'dark') {
                html.setAttribute('data-theme', 'dark');
            } else if (stored === 'light') {
                html.removeAttribute('data-theme');
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                html.setAttribute('data-theme', 'dark');
            }
            btn.addEventListener('click', function() {
                const isDark = html.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    html.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'light');
                } else {
                    html.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                }
            });
        }

            window.addEventListener('scroll', function() {
                if (window.scrollY > 600) {
                    btn.classList.add('visible');
                } else {
                    btn.classList.remove('visible');
                }
            });
            btn.addEventListener('click', function() {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        //  MOBILE MENU
        // ============================================================
        function setupMobileMenu() {
            const toggle = document.querySelector('.menu-toggle');
            const nav = document.querySelector('.nav-links');
            toggle.addEventListener('click', function() {
                const open = nav.classList.toggle('open');
                this.setAttribute('aria-expanded', open);
            });
            nav.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    nav.classList.remove('open');
                    toggle.setAttribute('aria-expanded', 'false');
                });
            });
        }

        // ============================================================
        //  SMOOTH SCROLL FOR NAV LINKS
        // ============================================================
        function setupNavScroll() {
            document.querySelectorAll('.nav-links a[href^="#"]').forEach(link => {
                link.addEventListener('click', function(e) {
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        e.preventDefault();
                        const offset = 80;
                        const top = target.getBoundingClientRect().top + window.scrollY - offset;
                        window.scrollTo({ top, behavior: 'smooth' });
                    }
                });
            });
        }
