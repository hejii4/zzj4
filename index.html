<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>张梓建 · 移动优先简历</title>
    <style>
        /* ===== 重置 & 基础（移动优先） ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --color-primary: #1e3a5f;
            --color-primary-light: #2d5a8a;
            --color-accent: #2d8cff;
            --color-accent-light: #6db3ff;
            --color-gold: #f6b83d;
            --color-bg: #f0f4f8;
            --color-card: #ffffff;
            --color-text: #1a2332;
            --color-text-secondary: #4a5a6e;
            --color-text-muted: #7a8a9e;
            --color-border: #dce4ec;
            --color-shadow: rgba(26, 35, 50, 0.08);
            --radius: 12px;
            --transition: 0.2s ease;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            --nav-height: 60px;
            --max-width: 1120px;
        }

        [data-theme="dark"] {
            --color-primary: #4a7db5;
            --color-primary-light: #6b9fd4;
            --color-bg: #0f172a;
            --color-card: #1b2d45;
            --color-text: #e8edf3;
            --color-text-secondary: #b0c4d8;
            --color-text-muted: #7a8fa8;
            --color-border: #2a3f5a;
            --color-shadow: rgba(0, 0, 0, 0.3);
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font);
            font-size: 16px;
            line-height: 1.6;
            background: var(--color-bg);
            color: var(--color-text);
            transition: background var(--transition), color var(--transition);
            padding-top: var(--nav-height);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: var(--color-accent);
            text-decoration: none;
            transition: color var(--transition);
        }
        a:hover {
            color: var(--color-accent-light);
        }

        /* 触控优化 */
        button,
        .btn,
        .navbar .nav-links a {
            min-height: 44px;
            min-width: 44px;
            touch-action: manipulation;
        }

        /* ===== 滚动条 ===== */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--color-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--color-primary-light);
            border-radius: 8px;
        }

        /* ===== 容器 ===== */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 16px 32px;
        }

        /* ===== 导航栏（移动优先） ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            background: rgba(var(--color-card-rgb, 255, 255, 255), 0.88);
            backdrop-filter: blur(12px) saturate(1.1);
            -webkit-backdrop-filter: blur(12px) saturate(1.1);
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 1000;
            transition: background var(--transition), border-color var(--transition);
        }
        [data-theme="dark"] .navbar {
            background: rgba(15, 23, 42, 0.9);
        }
        :root {
            --color-card-rgb: 255, 255, 255;
        }
        [data-theme="dark"] {
            --color-card-rgb: 27, 45, 69;
        }

        .navbar .brand {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--color-primary);
            letter-spacing: 0.3px;
            transition: color var(--transition);
        }
        .navbar .brand span {
            color: var(--color-accent);
        }

        .navbar .menu-toggle {
            display: block;
            background: transparent;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--color-text-secondary);
            padding: 4px 8px;
            line-height: 1;
        }

        .navbar .nav-links {
            display: none;
            flex-direction: column;
            position: absolute;
            top: var(--nav-height);
            left: 0;
            right: 0;
            background: var(--color-card);
            border-bottom: 1px solid var(--color-border);
            padding: 12px 16px;
            gap: 2px;
            box-shadow: 0 12px 30px var(--color-shadow);
            list-style: none;
            transition: all var(--transition);
        }
        .navbar .nav-links.open {
            display: flex;
        }
        .navbar .nav-links a {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            transition: all var(--transition);
            width: 100%;
            display: block;
        }
        .navbar .nav-links a:hover,
        .navbar .nav-links a.active {
            color: var(--color-text);
            background: var(--color-border);
        }

        .navbar .nav-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .navbar .nav-actions button {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 30px;
            color: var(--color-text-secondary);
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            min-width: 44px;
        }
        .navbar .nav-actions button:hover {
            background: var(--color-border);
            color: var(--color-text);
        }

        /* ===== Hero（移动优先） ===== */
        .hero {
            padding: 24px 0 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            align-items: center;
            text-align: center;
        }
        .hero .hero-text h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.2;
            color: var(--color-primary);
            transition: color var(--transition);
        }
        .hero .hero-text h1 .highlight {
            background: linear-gradient(135deg, var(--color-accent), var(--color-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero .hero-text .subtitle {
            font-size: 1rem;
            color: var(--color-text-secondary);
            margin-top: 4px;
            font-weight: 400;
        }
        .hero .hero-text .bio {
            margin-top: 12px;
            color: var(--color-text-secondary);
            font-size: 0.95rem;
            max-width: 100%;
            line-height: 1.7;
        }
        .hero .hero-text .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 16px;
        }
        .hero .hero-text .tag-group .tag {
            background: var(--color-border);
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            transition: all var(--transition);
            white-space: nowrap;
        }
        .hero .hero-text .tag-group .tag:hover {
            background: var(--color-accent);
            color: #fff;
        }
        .hero .hero-text .contact-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
        .hero .hero-text .contact-actions .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            background: var(--color-primary);
            color: #fff;
            min-height: 44px;
            min-width: 44px;
        }
        .hero .hero-text .contact-actions .btn:active {
            transform: scale(0.96);
        }
        .hero .hero-text .contact-actions .btn-outline {
            background: transparent;
            color: var(--color-text);
            border: 1.5px solid var(--color-border);
        }
        .hero .hero-text .contact-actions .btn-outline:hover {
            background: var(--color-border);
        }
        .hero .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .hero .hero-visual .avatar-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-primary-light), var(--color-accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 8px 32px rgba(45, 140, 255, 0.20);
            user-select: none;
        }

        /* ===== Highlights（移动优先） ===== */
        .highlights {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 20px 0 12px;
            border-top: 1px solid var(--color-border);
            border-bottom: 1px solid var(--color-border);
            margin: 8px 0 24px;
        }
        .highlights .hl-item {
            text-align: center;
            padding: 8px 4px;
        }
        .highlights .hl-item .number {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--color-accent);
            line-height: 1.2;
        }
        .highlights .hl-item .number .suffix {
            font-size: 1rem;
            font-weight: 600;
        }
        .highlights .hl-item .label {
            font-size: 0.7rem;
            color: var(--color-text-muted);
            margin-top: 2px;
            line-height: 1.3;
        }

        /* ===== Section ===== */
        .section {
            margin-top: 32px;
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .section-header h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--color-primary);
            transition: color var(--transition);
        }
        .section-header .line {
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--color-border), transparent);
        }

        /* ===== Tabs ===== */
        .tabs-container {
            margin-top: 4px;
        }
        .tabs-nav {
            display: flex;
            gap: 2px;
            border-bottom: 2px solid var(--color-border);
            padding-bottom: 0;
            flex-wrap: wrap;
        }
        .tabs-nav button {
            background: transparent;
            border: none;
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--color-text-muted);
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all var(--transition);
            position: relative;
            font-family: var(--font);
            min-height: 44px;
            touch-action: manipulation;
        }
        .tabs-nav button:hover {
            color: var(--color-text);
            background: var(--color-border);
        }
        .tabs-nav button[aria-selected="true"] {
            color: var(--color-accent);
            background: transparent;
        }
        .tabs-nav button[aria-selected="true"]::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 20%;
            right: 20%;
            height: 3px;
            background: var(--color-accent);
            border-radius: 4px 4px 0 0;
        }
        .tabs-panel {
            display: none;
            padding-top: 16px;
            animation: fadeUp 0.3s ease;
        }
        .tabs-panel.active {
            display: block;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Experience Cards ===== */
        .exp-card {
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 16px 18px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px var(--color-shadow);
            border: 1px solid var(--color-border);
            transition: all var(--transition);
        }
        .exp-card:active {
            transform: scale(0.99);
        }
        .exp-card .exp-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
        }
        .exp-card .exp-header h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--color-primary);
        }
        .exp-card .exp-header .company {
            font-weight: 600;
            color: var(--color-accent);
        }
        .exp-card .exp-header .period {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            font-weight: 500;
        }
        .exp-card .exp-desc {
            color: var(--color-text-secondary);
            font-size: 0.88rem;
            line-height: 1.6;
        }
        .exp-card .exp-desc ul {
            list-style: none;
            padding: 0;
            margin: 4px 0 0;
        }
        .exp-card .exp-desc ul li {
            padding: 4px 0 4px 20px;
            position: relative;
        }
        .exp-card .exp-desc ul li::before {
            content: '▹';
            position: absolute;
            left: 0;
            color: var(--color-accent);
            font-weight: 700;
        }
        .exp-card .exp-desc .strong {
            color: var(--color-text);
            font-weight: 600;
        }

        /* ===== Project Cards ===== */
        .project-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .project-card {
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 18px 18px;
            border: 1px solid var(--color-border);
            box-shadow: 0 2px 8px var(--color-shadow);
            transition: all var(--transition);
        }
        .project-card:active {
            transform: scale(0.99);
        }
        .project-card h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--color-primary);
        }
        .project-card .meta {
            font-size: 0.78rem;
            color: var(--color-text-muted);
            margin: 2px 0 8px;
        }
        .project-card p {
            font-size: 0.88rem;
            color: var(--color-text-secondary);
            line-height: 1.6;
        }
        .project-card .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .project-card .tags span {
            background: var(--color-border);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 500;
            color: var(--color-text-muted);
        }

        /* ===== Skills ===== */
        .skills-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        .skill-group {
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 14px 16px;
            border: 1px solid var(--color-border);
            box-shadow: 0 2px 6px var(--color-shadow);
        }
        .skill-group h4 {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }
        .skill-group .skill-items {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }
        .skill-group .skill-items .badge {
            background: var(--color-border);
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--color-text-secondary);
            transition: all var(--transition);
            white-space: nowrap;
        }
        .skill-group .skill-items .badge:hover {
            background: var(--color-accent);
            color: #fff;
        }

        /* ===== Education & Awards ===== */
        .edu-award-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .edu-card,
        .award-card {
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 16px 18px;
            border: 1px solid var(--color-border);
            box-shadow: 0 2px 6px var(--color-shadow);
        }
        .edu-card h3,
        .award-card h3 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--color-primary);
        }
        .edu-card .sub {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
        }
        .edu-card .period {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            margin-top: 2px;
        }
        .edu-card .desc {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            margin-top: 6px;
            line-height: 1.6;
        }
        .award-card ul {
            list-style: none;
            padding: 0;
            margin: 4px 0 0;
        }
        .award-card ul li {
            padding: 4px 0;
            font-size: 0.88rem;
            color: var(--color-text-secondary);
            border-bottom: 1px solid var(--color-border);
        }
        .award-card ul li:last-child {
            border-bottom: none;
        }
        .award-card ul li .date {
            font-size: 0.7rem;
            color: var(--color-text-muted);
            margin-left: 8px;
        }

        /* ===== Footer ===== */
        .footer {
            margin-top: 40px;
            padding: 16px 0 12px;
            border-top: 1px solid var(--color-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--color-text-muted);
            text-align: center;
        }
        .footer .heart {
            color: #e74c6f;
        }

        /* ===== Back to Top ===== */
        .back-top {
            position: fixed;
            bottom: 20px;
            right: 16px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--color-primary);
            color: #fff;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            transition: all var(--transition);
            opacity: 0;
            pointer-events: none;
            transform: translateY(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .back-top.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        .back-top:active {
            transform: scale(0.92);
        }

        /* ============================================================
               桌面增强 (min-width: 769px)
               ============================================================ */
        @media (min-width: 769px) {
            .container {
                padding: 0 32px 48px;
            }

            /* 导航显示为行内 */
            .navbar .menu-toggle {
                display: none;
            }
            .navbar .nav-links {
                display: flex !important;
                flex-direction: row;
                position: static;
                background: transparent;
                border: none;
                box-shadow: none;
                padding: 0;
                gap: 4px;
                width: auto;
            }
            .navbar .nav-links a {
                padding: 6px 16px;
                width: auto;
                border-radius: 30px;
                font-size: 0.85rem;
            }

            .hero {
                grid-template-columns: 1fr 1fr;
                text-align: left;
                padding: 40px 0 32px;
                gap: 40px;
            }
            .hero .hero-text .bio {
                max-width: 480px;
            }
            .hero .hero-text .tag-group {
                justify-content: flex-start;
            }
            .hero .hero-text .contact-actions {
                justify-content: flex-start;
            }
            .hero .hero-visual .avatar-placeholder {
                width: 180px;
                height: 180px;
                font-size: 4rem;
            }

            .highlights {
                grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
                gap: 16px;
                padding: 28px 0 16px;
                margin: 16px 0 32px;
            }
            .highlights .hl-item .number {
                font-size: 2rem;
            }
            .highlights .hl-item .label {
                font-size: 0.8rem;
            }

            .section-header h2 {
                font-size: 1.6rem;
            }

            .exp-card {
                padding: 24px 28px;
                margin-bottom: 20px;
                transition: transform var(--transition), box-shadow var(--transition);
            }
            .exp-card:hover {
                transform: translateY(-3px);
                box-shadow: 0 8px 30px var(--color-shadow);
            }

            .project-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 20px;
            }
            .project-card {
                padding: 22px 24px;
                transition: transform var(--transition), box-shadow var(--transition);
            }
            .project-card:hover {
                transform: translateY(-4px);
                box-shadow: 0 10px 36px var(--color-shadow);
            }

            .skills-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 16px;
            }
            .skill-group {
                padding: 18px 20px;
            }

            .edu-award-grid {
                grid-template-columns: 1fr 1fr;
                gap: 24px;
            }

            .footer {
                flex-direction: row;
                justify-content: space-between;
                padding: 24px 0 16px;
                font-size: 0.8rem;
            }

            .back-top {
                bottom: 28px;
                right: 28px;
                width: 44px;
                height: 44px;
            }
            .back-top:hover {
                transform: translateY(-4px) scale(1.04);
                box-shadow: 0 8px 28px rgba(30, 58, 95, 0.30);
            }
        }

        /* ===== 打印样式 ===== */
        @media print {
            .navbar,
            .back-top,
            .no-print {
                display: none !important;
            }
            body {
                padding-top: 0;
                background: #fff !important;
                color: #000 !important;
                font-size: 12px;
            }
            .container {
                max-width: 100%;
                padding: 16px 24px;
            }
            .hero {
                grid-template-columns: 1fr 1fr;
                gap: 20px;
                padding: 16px 0;
            }
            .hero .hero-text h1 {
                font-size: 2rem;
                color: #1a2332 !important;
            }
            .hero .hero-visual .avatar-placeholder {
                width: 100px;
                height: 100px;
                font-size: 2rem;
                background: #e8edf3;
                color: #1a2332;
                box-shadow: none;
            }
            .highlights {
                grid-template-columns: repeat(4, 1fr);
                border-color: #ddd;
            }
            .highlights .hl-item .number {
                color: #1e3a5f;
            }
            .exp-card,
            .project-card,
            .skill-group,
            .edu-card,
            .award-card {
                box-shadow: none !important;

        function renderExperienceTabs() {
            const nav = document.getElementById('expTabsNav');
            const panels = document.getElementById('expPanels');
            const keys = Object.keys(resume.experiences).filter(k => resume.experiences[k].length > 0);
            if (!keys.length) {
                nav.innerHTML = '';
                panels.innerHTML = '<p style="color:var(--color-text-muted);padding:12px 0;">暂无经历</p>';
                return;
            }
            const labelMap = { internship: '💼 实习', campus: '🎓 校园', work: '🏢 工作' };
            nav.innerHTML = keys.map((key, idx) =>
                `<button role="tab" aria-selected="${idx === 0 ? 'true' : 'false'}" 
                         aria-controls="panel-${key}" id="tab-${key}" data-key="${key}">
                    ${labelMap[key] || key}
                </button>`
            ).join('');

            panels.innerHTML = keys.map((key, idx) => {
                const cards = resume.experiences[key].map(exp => `
                    <div class="exp-card">
                        <div class="exp-header">
                            <h3>${exp.title} <span class="company">· ${exp.company}</span></h3>
                            <span class="period">${exp.period} · ${exp.location}</span>
                        </div>
                        <div class="exp-desc"><ul>${exp.details.map(d => `<li>${d}</li>`).join('')}</ul></div>
                    </div>
                `).join('');
                return `<div id="panel-${key}" class="tabs-panel ${idx === 0 ? 'active' : ''}" 
                          role="tabpanel" aria-labelledby="tab-${key}">${cards}</div>`;
            }).join('');

            // 事件绑定
            document.querySelectorAll('#expTabsNav button').forEach(btn => {
                btn.addEventListener('click', function() {
                    const key = this.dataset.key;
                    document.querySelectorAll('#expTabsNav button').forEach(b =>
                        b.setAttribute('aria-selected', 'false'));
                    this.setAttribute('aria-selected', 'true');
                    document.querySelectorAll('#expPanels .tabs-panel').forEach(p => p.classList.remove('active'));
                    const panel = document.getElementById(`panel-${key}`);
                    if (panel) panel.classList.add('active');
                });
                btn.addEventListener('keydown', function(e) {
                    const btns = [...document.querySelectorAll('#expTabsNav button')];
                    const idx = btns.indexOf(this);
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                        e.preventDefault();
                        btns[(idx + 1) % btns.length]?.click();
                    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                        e.preventDefault();
                        btns[(idx - 1 + btns.length) % btns.length]?.click();
                    }
                });
            });
        }

        // ===== 邮箱复制（防爬虫） =====
        function setupEmailCopy() {
            const btn = document.getElementById('emailBtn');
            if (!btn) return;
            btn.addEventListener('click', function() {
                const email = '1689977618@qq.com';
                if (navigator.clipboard?.writeText) {
                    navigator.clipboard.writeText(email).then(() => {
                        const orig = this.textContent;
                        this.textContent = '✅ 已复制';
                        setTimeout(() => { this.textContent = orig; }, 2000);
                    }).catch(() => fallbackCopy(email, this));
                } else {
                    fallbackCopy(email, this);
                }
            });
        }

        function fallbackCopy(email, btn) {
            const ta = document.createElement('textarea');
            ta.value = email;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                const orig = btn.textContent;
                btn.textContent = '✅ 已复制';
                setTimeout(() => { btn.textContent = orig; }, 2000);
            } catch (e) {
                alert('复制失败，请手动复制：' + email);
            }
            document.body.removeChild(ta);
        }

        // ===== 主题切换 =====
        function setupTheme() {
            const btn = document.querySelector('.theme-toggle');
            const html = document.documentElement;
            const stored = localStorage.getItem('theme');
            if (stored === 'dark') html.setAttribute('data-theme', 'dark');
            else if (stored === 'light') html.removeAttribute('data-theme');
            else if (window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
                html.setAttribute('data-theme', 'dark');
            }
            btn.addEventListener('click', function() {
                const isDark = html.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    html.removeAttribute('data-theme');
                    localStorage.setItem('theme', 'light');
                } else {
                    html.setAttribute('data-theme', 'dark');
                    localStorage.setItem('theme', 'dark');
                }
            });
        }

        function setupPrint() {
            document.querySelectorAll('.print-btn').forEach(btn => {

            const btn = document.getElementById('backTop');
            window.addEventListener('scroll', function() {
                btn.classList.toggle('visible', window.scrollY > 400);
            }, { passive: true });
            btn.addEventListener('click', function() {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        // ===== 移动端菜单 =====
        function setupMobileMenu() {
            const toggle = document.querySelector('.menu-toggle');
            const nav = document.querySelector('.nav-links');
            toggle.addEventListener('click', function() {
                const open = nav.classList.toggle('open');
                this.setAttribute('aria-expanded', open);
            });
            nav.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    nav.classList.remove('open');
                    toggle.setAttribute('aria-expanded', 'false');
                });
            });
        }

        // ===== 平滑导航滚动 =====
        function setupNavScroll() {
            document.querySelectorAll('.nav-links a[href^="#"]').forEach(link => {
                link.addEventListener('click', function(e) {
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        e.preventDefault();
                        const top = target.getBoundingClientRect().top + window.scrollY - 70;
                        window.scrollTo({ top, behavior: 'smooth' });
                    }
                });
            });
        }

        renderHeroTags();

        setupMobileMenu();
        setupNavScroll();
